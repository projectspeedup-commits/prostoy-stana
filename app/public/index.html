<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9edf2">
  <title>Простой стана</title>
  <script src="theme.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="timeline.css">
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <header class="topbar">
    <button id="conn" type="button" aria-label="Связаться" title="Связаться" class="pill wait">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-3 2 2-6a8.5 8.5 0 1 1 18-4.5Z"/><path d="M7 10h10M7 14h6"/></svg>
      <span class="pill-text">Связаться</span>
    </button>
    <button id="demo" type="button" aria-label="На главный экран" title="На главный экран" class="pill home" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg>
      <span class="pill-text">На главный экран</span>
    </button>
    <button id="admin" type="button" aria-label="Администратор" title="Администратор" class="pill admin" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      <span class="pill-text">Администратор</span>
    </button>
    <button id="save-status" type="button" class="save-status" aria-live="polite" aria-controls="rejects" aria-expanded="false" hidden></button>
    <div class="brand"><strong>ПРОКАТНЫЙ СТАН</strong><span>система учёта простоев</span></div>
    <button id="theme" type="button" class="theme-toggle" aria-label="Переключить на тёмную тему" aria-pressed="false" title="Переключить на тёмную тему">
      <svg class="bulb" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="bulb-glass" d="M12 2.5a6.5 6.5 0 0 0-3.9 11.7c.6.5 1 1.2 1 2V17h5.8v-.8c0-.8.4-1.5 1-2A6.5 6.5 0 0 0 12 2.5z"/>
        <path class="bulb-base" d="M9.2 18.6h5.6M9.8 21h4.4"/>
        <path class="bulb-rays" d="M12 .2v1M3.2 4l.8.7M20.8 4l-.8.7M.8 10.5h1.2M22 10.5h1.2"/>
      </svg>
    </button>
  </header>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <main id="main" aria-label="Учёт работы стана"></main>
  <section id="rejects" class="rejects" aria-label="Записи, которые нужно исправить" hidden></section>
  <noscript>Для работы приложения включите JavaScript в браузере планшета.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
