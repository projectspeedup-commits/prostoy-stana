<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <title>Простой стана</title>
  <script src="theme.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="timeline.css">
</head>
<body>
  <header class="topbar">
    <button id="conn" type="button" class="pill wait">Связаться</button>
    <button id="demo" type="button" class="pill home" hidden>На главный экран</button>
    <button id="theme" type="button" class="pill theme-toggle" aria-label="Светлая тема" title="Переключить на светлую тему">&#x2600;&#xFE0E; Светлая</button>
  </header>
  <p id="save-status" class="save-status" role="status" aria-live="polite" hidden></p>
  <main id="main" aria-label="Учёт работы стана"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <section id="rejects" class="rejects" aria-label="Записи, которые нужно исправить" hidden></section>
  <noscript>Для работы приложения включите JavaScript в браузере планшета.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
