<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9edf2">
  <title>Простой стана</title>
  <script src="theme.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/golos-text-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="timeline.css">
  <link rel="stylesheet" href="report.css">
  <link rel="stylesheet" href="pult.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 13.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8M1.5 12h21"/></svg></span>
      <span class="brand-name"><strong>Простой стана</strong><span>прокатный стан · учёт простоев</span></span>
    </div>
    <button id="save-status" type="button" class="save-status" aria-live="polite" aria-controls="rejects" aria-expanded="false" hidden></button>
    <div class="topclock"><span id="topclock-time" data-msk="1"></span><small id="topdate"></small></div>
    <button id="theme" type="button" class="theme-toggle" aria-label="Переключить на тёмную тему" aria-pressed="false" title="Переключить на тёмную тему">
      <svg class="bulb" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="bulb-glass" d="M12 2.5a6.5 6.5 0 0 0-3.9 11.7c.6.5 1 1.2 1 2V17h5.8v-.8c0-.8.4-1.5 1-2A6.5 6.5 0 0 0 12 2.5z"/>
        <path class="bulb-base" d="M9.2 18.6h5.6M9.8 21h4.4"/>
        <path class="bulb-rays" d="M12 .2v1M3.2 4l.8.7M20.8 4l-.8.7M.8 10.5h1.2M22 10.5h1.2"/>
      </svg>
    </button>
  </header>
  <nav id="nav" class="appnav" aria-label="Разделы">
    <button id="demo" type="button" aria-label="Пульт" title="Пульт" class="pill home" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
      <span class="pill-text">Пульт</span>
    </button>
    <button id="nav-shift" type="button" aria-label="Разбор простоев" title="Разбор простоев" class="pill" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span class="pill-text">Разбор</span>
    </button>
    <button id="nav-stats" type="button" aria-label="Показатели стана" title="Показатели стана" class="pill" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M8 16v-5M13 16V8M18 16v-3"/></svg>
      <span class="pill-text">Показатели</span>
    </button>
    <button id="conn" type="button" aria-label="Связаться" title="Связаться" class="pill wait">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      <span class="pill-text">Связаться</span>
    </button>
    <button id="admin" type="button" aria-label="Администратор" title="Администратор" class="pill admin" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><path d="M15 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4M9 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4M17 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/></svg>
      <span class="pill-text">Админ</span>
    </button>
    <button id="ai-ask" type="button" aria-label="Спросить ассистента" title="Спросить ассистента" class="pill ai-ask" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"/></svg>
      <span class="pill-text">Ассистент</span>
    </button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <main id="main" aria-label="Учёт работы стана"></main>
  <section id="rejects" class="rejects" aria-label="Записи, которые нужно исправить" hidden></section>
  <noscript>Для работы приложения включите JavaScript в браузере планшета.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
